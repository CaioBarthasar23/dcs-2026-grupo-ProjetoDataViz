name: coleta-diaria

# 21:30 UTC = 18:30 em Brasilia (o TCGCSV atualiza por volta de 17h BRT).
# As duas execucoes seguintes sao tentativas de reserva: o coletor e
# idempotente, entao o que ja foi gravado nao e regravado.
# O GitHub pode atrasar execucoes agendadas; o coletor tolera isso.
on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch: {}   # botao "Run workflow" na aba Actions

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projeto_final
    env:
      GROUP_ID: "23651"
      USER_AGENT: "colecao-ssp/1.0"
      S3_BUCKET: "tcg"
      S3_REGION: "us-east-1"
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projeto_final/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar
        run: |
          if [ -n "$S3_ENDPOINT" ]; then
            export STORAGE=s3
          else
            export STORAGE=local
            echo "::warning::Secrets do MinIO nao configurados: gravando so em disco e guardando como artifact."
          fi
          python -m src.collector collect

      # Rede de seguranca enquanto o MinIO nao esta pronto: o disco do runner
      # some ao fim da execucao, entao guardamos o bruto como artifact (90 dias).
      - name: Guardar bruto como artifact
        if: ${{ always() && env.S3_ENDPOINT == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: projeto_final/data_local/
          if-no-files-found: ignore
          retention-days: 90
